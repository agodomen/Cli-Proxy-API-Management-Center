# import-boundary-allowlist.conf — 二开代码对上游 internal 包的既有依赖
#
# bin/check-import-boundary.sh 断言：internal/core/ 与 cmd/cpamc/ 对上游
# internal/** 的引用集合是本文件的子集。新增引用会失败，删除引用不会失败。
#
# 这是一个「棘轮」：条目只允许减少。目标是收敛到只剩 upstreamshim 一个包。
# 背景与收敛计划：docs/architecture/backend-extension-architecture.md §6.2
#
# 格式：<相对 backend/ 的 .go 文件>:<上游包路径（去掉 module 前缀）>

# ---- cmd/cpamc ----
# buildinfo：-ldflags 版本注入的锚点，无 SDK 等价物。
cmd/cpamc/main.go:internal/buildinfo

# ---- internal/core/cli ----
# run.gen.go 由 bin/gen-cli-mirror.sh 从 cmd/server/main.go 生成，其 import 面
# 等于上游入口的 import 面，不由人决定，因此脚本不把生成文件纳入棘轮（只统计
# 并打印）。收敛路径：上游把入口主体抽成可导入的包后，该文件与生成器一起删除。

# ---- internal/core/httpapi ----
# internal/config：需要 PluginInstanceConfig 与 ResolvePluginsDir，sdk/config 未导出。
# internal/pluginhost：需要 ValidatePluginID 与 DiscoverPluginFiles，sdk/pluginhost 未导出。
# 收敛路径：这 4 个符号回流 SDK，或集中到 upstreamshim。
internal/core/httpapi/plugin_store.go:internal/config
internal/core/httpapi/plugin_store.go:internal/pluginhost
internal/core/httpapi/plugin_store_test.go:internal/config
internal/core/httpapi/server.go:internal/config

# ---- internal/core/localengine ----
# internal/api：ServerOption。sdk/api 已提供等价物，可直接替换。
# internal/pluginhost：Host 构造。sdk/pluginhost 已提供等价物，但缺少上面两个函数。
internal/core/localengine/runtime.go:internal/api
internal/core/localengine/runtime.go:internal/pluginhost

# ---- internal/core/upstreamcontract ----
# 契约测试必须直接构造上游 HTTP server 才能枚举真实路由表：sdk/cliproxy 的
# Builder 只在 Run 时才建 server，sdk 也没有暴露「只建不跑」的入口。
# 这一条本质上是「为了检测上游漂移而依赖上游」，属于可接受的例外。
internal/core/upstreamcontract/management_routes_test.go:internal/api
