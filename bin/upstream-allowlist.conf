# upstream-allowlist.conf — 上游镜像的已批准差异清单
#
# bin/check-upstream-drift.sh 会把 backend/ 的镜像范围与 pin 基线逐文件比对，
# 并要求「差异集合 == 本文件声明的集合」。任何未声明的差异都是错误。
#
# 与 sync-manifest.conf 的区别：
#   sync-manifest.conf  = 同步时跳过覆盖的文件（输入）
#   upstream-allowlist.conf = 允许存在的差异（断言）
#
# 格式：每行一个相对于 backend/ 的路径，目录以 / 结尾。# 开头为注释。

# ===== 本地新增：上游没有、本仓独有 =====
[local-only]
# 二开统一入口
cmd/cpamc/
# 二开业务实现（社区无此目录）
internal/core/

# ===== 本地修改：镜像了上游文件但内容有差异 =====
[modified]
