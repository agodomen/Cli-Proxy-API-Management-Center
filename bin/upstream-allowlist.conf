# 不要手工编辑该文件。只放宽「跟随重定向后」的 artifact URL 校验，让 GitHub
# Release CDN 的短期签名参数通过；registry / manifest 声明的 URL 走另一个未被
# 补丁覆盖的校验，仍然拒绝敏感查询参数。
# 行为回归：internal/core/httpapi/plugin_store_patch_test.go
# 计划：回流上游后同时删除补丁、本条与该测试。详见 §6.4
internal/pluginstore/auth.go

# 以上游为基线追加 internal/core 所需的 modernc.org/sqlite 后 go mod tidy。
# 计划：双 module 拆分后本地依赖迁入 cpamc/go.mod，此处恢复逐字节一致。
go.mod
go.sum

