# sync-manifest.conf — 社区代码同步手动合并清单
#
# 格式：每行一个相对路径（相对于挂载点根目录），以 # 开头为注释。
# 脚本 bin/sync-community.sh 会跳过这些文件，不做自动覆盖，
# 合并结束后打印清单提醒人工处理。
#
# ===== 后端 (backend/) =====
[backend]
# 空。后端已不再依赖「跳过覆盖」来保留本地改动：
#   - 必须落在上游文件里的改动改为 backend/patches/*.patch，由脚本 git apply
#     重放，冲突即失败（见 docs/architecture/backend-extension-architecture.md §6.4）
#   - 上游入口的镜像改为 bin/gen-cli-mirror.sh 生成
# 因此后端同步不再需要 --confirm-manifest。

# ===== 前端 (frontend/) =====
[frontend]
# index.html — 入口指向 external/main.tsx，不能覆盖
index.html

# tsconfig.json — 本地新增了 exclude 测试文件 + references tsconfig.app.json
tsconfig.json

# tsconfig.app.json — 本地新增文件，上游不存在
tsconfig.app.json

# package.json — 本地新增 vitest 依赖
package.json

# bun.lock — 本地新增依赖后 lockfile 变化
bun.lock

# 二开运行入口全部位于 src/external；这些社区入口保持不存在，避免重新
# 接入 quick-start / quick-fill 商业交互。
src/main.tsx
src/App.tsx
src/router/MainRoutes.tsx
src/components/layout/MainLayout.tsx

# 商业入口排除。正常 AI Providers 页面使用 external 中的无广告实现。
src/features/providers/ProvidersWorkbenchPage.tsx
src/features/providers/components/ProviderCategoryList.tsx
src/features/providers/components/SponsorQuickStartPanel.tsx
src/features/providers/components/SponsorQuickStartPanel.module.scss
src/features/providers/sheets/ProviderSheet.tsx
